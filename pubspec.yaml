name: message_pro
description: "Message Pro - Smart Multi-Channel Customer Communication Platform"
publish_to: 'none'
version: 1.0.9+15

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  intl: ">=0.20.2 <=0.20.3"
  uuid: ^4.5.1
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  shorebird_code_push: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  dartz: ^0.10.1
  equatable: ^3.0.0
  flutter_screenutil: ^5.9.3
  google_sign_in: ^7.2.0
  pretty_dio_logger: ^1.4.0
  audioplayers: ^6.8.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  hugeicons: ^4.4.0
  record: ^7.1.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/icons/
    - assets/images/
    - assets/images/brand/
    - assets/images/brand/letters/
    - assets/images/brand/svg/
    - assets/images/channels/
    - assets/images/splash/
    - assets/local/
    - assets/local/avatars/
    - assets/local/avatars-small/
    - shorebird.yaml

  fonts:
    - family: Gontserrat
      fonts:
        - asset: assets/fonts/Gontserrat-Regular.ttf
        - asset: assets/fonts/Gontserrat-Italic.ttf
          style: italic
        - asset: assets/fonts/Gontserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gontserrat-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400-20.ttf
          weight: 400
        - asset: assets/fonts/Inter-500-24.ttf
          weight: 500
        - asset: assets/fonts/Inter-580-24.ttf
          weight: 600
        - asset: assets/fonts/Inter-600-20.ttf
          weight: 700
