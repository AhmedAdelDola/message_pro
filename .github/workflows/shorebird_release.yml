name: Shorebird iOS & Android Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to release'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - both
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  workflow-ready:
    name: Check Workflow
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Confirm Ready
        run: echo "Shorebird Release workflow is active and ready. Trigger via 'Run workflow'."

  release-ios:
    name: Build Shorebird iOS Release
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'both')
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Prepare iOS Build Directories
        run: |
          mkdir -p build/ios/SourcePackages
          shorebird flutter config --no-enable-swift-package-manager

      - name: Shorebird Release iOS
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          COCOAPODS_DISABLE_STATS: 'true'
        run: |
          # If Apple signing certificates are not configured in CI, build without codesign or with manual signing
          shorebird release ios --no-codesign --flutter-version=8352242a910a1f79747cb1c6d2aa02edc5f3fc12

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ios-release-archive
          path: build/ios/archive/Runner.xcarchive
          retention-days: 1
          if-no-files-found: warn

      - name: Install Apple Certificate
        if: env.HAVE_CERT == 'true'
        env:
          HAVE_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 12)

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "Certificate imported to temporary keychain successfully."

      - name: Install Provisioning Profile
        if: env.HAVE_PROFILE == 'true'
        env:
          HAVE_PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          export PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$PP_PATH"

          python3 -c '
          import os, subprocess, plistlib, hashlib, shutil

          pp_path = os.environ.get("PP_PATH") or os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "profile.mobileprovision")
          dest_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          os.makedirs(dest_dir, exist_ok=True)

          profile = {}
          if os.path.exists(pp_path):
              try:
                  out = subprocess.check_output(["security", "cms", "-D", "-i", pp_path], stderr=subprocess.DEVNULL)
                  profile = plistlib.loads(out)
              except Exception as e:
                  print(f"Error parsing provisioning profile: {e}")

          uuid = profile.get("UUID", "profile")
          name = profile.get("Name", "MessagePro")
          certs = profile.get("DeveloperCertificates", [])
          profile_sha1s = [hashlib.sha1(c).hexdigest().upper() for c in certs]

          try:
              keychain_identities = subprocess.check_output(["security", "find-identity", "-p", "codesigning", "-v"]).decode("utf-8", "ignore")
          except Exception:
              keychain_identities = ""

          print(f"Provisioning Profile Name: {name}")
          print(f"Provisioning Profile UUID: {uuid}")
          print(f"Number of certificates in profile: {len(certs)}")
          print(f"Keychain identities:\n{keychain_identities.strip()}")

          if os.path.exists(pp_path):
              target_uuid = os.path.join(dest_dir, f"{uuid}.mobileprovision")
              shutil.copyfile(pp_path, target_uuid)
              target_name = os.path.join(dest_dir, f"{name}.mobileprovision")
              shutil.copyfile(pp_path, target_name)
              target_fixed = os.path.join(dest_dir, "MessagePro.mobileprovision")
              shutil.copyfile(pp_path, target_fixed)
              print(f"Provisioning profile installed successfully to {target_uuid} and {target_fixed}")
          else:
              print(f"Warning: Provisioning profile file not found at {pp_path}")
          '

      - name: Setup App Store Connect API Key
        if: env.HAVE_ASC_KEY == 'true'
        env:
          HAVE_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          mkdir -p private_keys
          python3 -c '
          import os, sys, base64

          content = os.environ.get("KEY_CONTENT", "").strip()
          if (content.startswith("\"") and content.endswith("\"")) or (content.startswith("\x27") and content.endswith("\x27")):
              content = content[1:-1].strip()

          if "-----BEGIN" not in content:
              try:
                  decoded = base64.b64decode(content).decode("utf-8")
                  if "-----BEGIN" in decoded:
                      content = decoded
              except Exception:
                  pass

          lines = [l.strip() for l in content.splitlines() if l.strip()]
          full_text = " ".join(lines)
          if "-----BEGIN PRIVATE KEY-----" in full_text and "-----END PRIVATE KEY-----" in full_text:
              parts = full_text.split("-----BEGIN PRIVATE KEY-----")
              rest = parts[1].split("-----END PRIVATE KEY-----")
              body = rest[0].replace(" ", "").replace("\r", "").replace("\n", "")
          elif "-----BEGIN" in full_text and "-----END" in full_text:
              parts = full_text.split("-----")
              body = "".join([p for p in parts if not p.startswith("BEGIN") and not p.startswith("END")]).replace(" ", "").replace("\r", "").replace("\n", "")
          else:
              body = full_text.replace(" ", "").replace("\r", "").replace("\n", "")

          chunks = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(chunks) + "\n-----END PRIVATE KEY-----\n"

          key_id = os.environ.get("KEY_ID", "").strip()
          out_path = f"private_keys/AuthKey_{key_id}.p8"
          with open(out_path, "w", newline="\n") as f:
              f.write(pem)

          print(f"Generated normalized PEM key: {out_path} ({len(pem)} bytes)")
          '
          cp private_keys/AuthKey_$KEY_ID.p8 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          cp private_keys/AuthKey_$KEY_ID.p8 ~/.private_keys/AuthKey_$KEY_ID.p8

      - name: Export and Upload to App Store Connect
        if: env.HAVE_ASC_KEY == 'true'
        env:
          HAVE_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CUSTOM_EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          python3 -c '
          import os, sys

          custom = os.environ.get("CUSTOM_EXPORT_OPTIONS", "").strip()
          team_id = os.environ.get("TEAM_ID", "").strip()

          if custom:
              if "plist" in custom or "dict" in custom:
                  content = custom
              else:
                  import base64
                  try:
                      content = base64.b64decode(custom).decode("utf-8")
                  except Exception:
                      content = custom
          else:
              content = f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.message.pro.com</key>
                  <string>MessagePro</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>teamID</key>
              <string>{team_id}</string>
          </dict>
          </plist>
          """
          os.makedirs("ios", exist_ok=True)
          with open("ios/ExportOptions.plist", "w", encoding="utf-8") as f:
              f.write(content)
          print("ios/ExportOptions.plist prepared successfully.")
          '

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_$KEY_ID.p8" \
            || {
              echo "=== Detailed Export / Distribution Diagnostics ===";
              find ~/Library/Developer/Xcode/DerivedData -name "IDEDistribution*.log" -exec cat {} + 2>/dev/null || true;
              exit 1;
            }

          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            echo "Found generated IPA: $IPA_FILE"
            echo "Uploading IPA to App Store Connect via xcrun altool..."
            xcrun altool --upload-app -f "$IPA_FILE" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 3
          if-no-files-found: ignore

  release-android:
    name: Build Shorebird Android Release
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'android' || inputs.platform == 'both')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird Release Android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android --no-confirm --flutter-version=8352242a910a1f79747cb1c6d2aa02edc5f3fc12

      - name: Upload Android AAB Bundle
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error
